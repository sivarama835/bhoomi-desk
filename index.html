<title>Bhoomi Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky ledger header with tabs; one working column of panels below, like a broker's register. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#f6f8f6; --ink:#15221d; --muted:#5a6a63; --line:#d6ded9;
  --brand:#0e5a4b; --brand-ink:#ffffff; --brand-soft:#dcebe6; --accent:#b97a06; --accent-soft:#f7ecd4;
  --good:#1d7a48; --good-soft:#dff1e6; --warn:#a96300; --warn-soft:#fbeed8; --bad:#b0281f; --bad-soft:#f8e1de;
  --shadow:0 1px 2px rgba(15,40,30,.06),0 6px 20px rgba(15,40,30,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#151e1b; --sunk:#111917; --ink:#e4ebe7; --muted:#97a69f; --line:#28342f;
  --brand:#45b49b; --brand-ink:#05211a; --brand-soft:#173830; --accent:#e3ab3e; --accent-soft:#3a2e14;
  --good:#5cc489; --good-soft:#163524; --warn:#e6a64a; --warn-soft:#3a2a12; --bad:#f07a6f; --bad-soft:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#151e1b; --sunk:#111917; --ink:#e4ebe7; --muted:#97a69f; --line:#28342f;
  --brand:#45b49b; --brand-ink:#05211a; --brand-soft:#173830; --accent:#e3ab3e; --accent-soft:#3a2e14;
  --good:#5cc489; --good-soft:#163524; --warn:#e6a64a; --warn-soft:#3a2a12; --bad:#f07a6f; --bad-soft:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
.mark svg{display:block}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--f-body);font-weight:400;letter-spacing:.02em}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--brand)}
nav.tabs a:hover{color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{flex:none}

main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.banner p{margin:0;flex:1;min-width:220px}

.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:26px;font-weight:700;margin-right:auto}
.pagehead .sub{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .note{font-size:12.5px;color:var(--muted)}
.stat.alert .val{color:var(--bad)}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:16px;font-weight:700}
.panel .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .phead h3{margin-right:auto}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--sunk)}

/* follow-up rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .who{font-weight:600}
.row .what{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daypill{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line);text-align:center;min-width:74px}
.daypill.over{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.daypill.today{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.grouplbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:12px 4px 4px}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.barrow .fill{height:100%;background:var(--brand);border-radius:5px}
.barrow .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.barrow .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.plot{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip.venture{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.commercial{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);border-color:transparent}
.chip.Available{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.Hold{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.Sold{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.sample{background:transparent;border-style:dashed}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}

/* board */
.boardwrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:10px;min-width:1580px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.over{outline:2px dashed var(--brand);outline-offset:-3px}
.colhead{display:flex;align-items:baseline;gap:8px;padding:4px 6px}
.colhead b{font-family:var(--f-display);font-size:14px}
.colhead .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.colhead .sum{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:var(--shadow)}
.card:active{cursor:grabbing}
.card .t{display:flex;gap:6px;align-items:center}
.card .t b{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.card .f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stage-dot{width:8px;height:8px;border-radius:50%;flex:none}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}

/* ventures */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.vcard:hover{border-color:var(--brand)}
.vcard h4{margin:0;font-family:var(--f-display);font-size:17px}
.vcard .loc{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.meter{height:8px;border-radius:4px;background:var(--bad-soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead h3{font-size:21px;margin-right:auto}
.dbody{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}
.dsec{display:flex;flex-direction:column;gap:8px}
.dsec > .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone .mono{font-size:15px;user-select:all}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label,.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.fields label.full,.form label.full{grid-column:1/-1}
.fields input,.fields select,.fields textarea,.form input,.form select,.form textarea{color:var(--ink);font-size:14px}
.detailkv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:13px}
.detailkv div span{display:block;color:var(--muted);font-size:11.5px}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.match b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match small{color:var(--muted)}
.log{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.log .e{padding:4px 0 10px 14px;position:relative}
.log .e::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.log .e .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.log .e .ty{font-weight:600;margin-right:6px}
.addnote{display:flex;gap:8px;flex-wrap:wrap}
.addnote input{flex:1;min-width:160px}

/* dialog form */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(5,15,12,.45)}
.form{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.form .fh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.form .fh h3{font-size:19px;margin-right:auto}
.form .fb{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .ff{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form .hint{font-size:11.5px;color:var(--muted);font-weight:400}
.form .err{color:var(--bad);font-size:12.5px;grid-column:1/-1}
@media (max-width:560px){.form .fb,.fields{grid-template-columns:1fr}.detailkv{grid-template-columns:1fr 1fr}}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.right{margin-left:auto}

/* media + map + measurements */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);cursor:pointer;padding:0;max-width:100%;display:block;width:100%}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:15px;line-height:26px;padding:0}
.thumb.busy{display:grid;place-items:center;color:var(--muted);font-size:12px;cursor:default}
.uploader{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--sunk)}
.uploader.drag{border-color:var(--brand);background:var(--brand-soft)}
.uploader .pick{display:inline-flex!important;flex-direction:row!important;color:var(--ink)!important;cursor:pointer}
.fsec{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);font-weight:700;padding-top:12px;border-top:1px solid var(--line)}
.fsec:first-child{border-top:0;padding-top:0}
.calc{grid-column:1/-1;font-family:var(--f-mono);font-size:12.5px;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:7px 10px}
.calc:empty{display:none}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(60px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;border-radius:6px}
.lbbtn{position:absolute;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
.lbbtn.close{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.lbbtn.prev{left:calc(10px + env(safe-area-inset-left,0px));top:50%}
.lbbtn.next{right:calc(10px + env(safe-area-inset-right,0px));top:50%}
.lbcap{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#ddd;font-size:13px}
.sides{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.sides div{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--sunk)}
.sides span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sides b{font-family:var(--f-mono);font-weight:500}
.areas{display:flex;flex-wrap:wrap;gap:6px}
.areas span{font-family:var(--f-mono);font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.areas span:first-child{background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:500}
.person{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px}
.person b{font-size:15px}
.cthumb{width:56px;height:42px;border-radius:6px;object-fit:cover;background:var(--sunk);border:1px solid var(--line);flex:none;display:block}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.prow:hover{background:var(--sunk)}
.prow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small{color:var(--muted)}
.chip.heat.Hot{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.heat.Warm{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.heat.Cold{background:color-mix(in srgb,var(--brand) 10%,var(--sunk));color:var(--muted);border-color:transparent}
.chip.agent{background:transparent}
.scorebox{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.aibar{display:flex;gap:6px;flex-wrap:wrap}
.aibar select{flex:1;min-width:120px}
.aiout{border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));background:var(--brand-soft);border-radius:10px;padding:10px;font-size:13px}
.aiout textarea{background:var(--surface)}
.aiout.err,.aiout .err{color:var(--bad)}
.tplprev{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.subcard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const STAGES = ["New","Contacted","Site Visit","Negotiation","Token Paid","Registered","Lost"];
const STAGE_COLOR = {"New":"var(--muted)","Contacted":"var(--brand)","Site Visit":"var(--accent)","Negotiation":"var(--warn)","Token Paid":"var(--good)","Registered":"var(--good)","Lost":"var(--bad)"};
const ACTIVE = ["New","Contacted","Site Visit","Negotiation","Token Paid"];
const SOURCES = ["99acres","MagicBricks","Housing.com","NoBroker","Facebook / Instagram","Google","WhatsApp","Walk-in","Referral","Hoarding / Flyer","Other"];
const INTERESTS = ["Plot","Venture","Commercial"];
const FACING = ["East","West","North","South","North-East","North-West","South-East","South-West"];
const APPROVALS = ["DTCP","HMDA","RERA","BDA / BMRDA","CMDA","Panchayat","Other","None"];
const UNITS = ["sq.yd","sq.ft","cent","acre","gunta","ankanam","sq.m"];
const UNIT_SQFT = { "sq.ft":1, "sq.yd":9, "cent":435.6, "acre":43560, "gunta":1089, "ankanam":72, "sq.m":10.7639 };
const SELLER_TYPES = ["Owner","Joint / family owners","Power of attorney (GPA)","Builder / Developer","Another broker"];
const PSTATUS = ["Available","Hold","Sold"];
const COMM_TYPES = ["Shop","Office","Showroom","Commercial land","Warehouse","Building"];
const ACT_TYPES = ["Call","WhatsApp","Site visit","Meeting","Note"];

/* ---------- state ---------- */
const S = { leads:[], props:[], ventures:[], sellers:[], agents:[], templates:[], docs:[], settingsList:[], news:[], market:[], db:null, dl:null, assets:null, ai:null, mcp:null, loaded:{leads:false,props:false,ventures:false,sellers:false,agents:false,templates:false,docs:false,settingsList:false,news:false,market:false}, dbState:"connecting", readOnly:false,
  view:"today", leadMode:"board", leadQ:"", leadInterest:"", invTab:"Plot", invQ:"", invStatus:"", sellerQ:"", leadAgent:"", teamPeriod:"month", docQ:"", docType:"", docLink:"", tplSel:{}, mkQ:"", mkKind:"", mkPosted:"", mkStatus:"", openMk:null, newsDay:"", newsQ:"", newsCat:"", newsImpact:"", openLead:null, openProp:null, openSeller:null, lb:null };

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => new Date().toLocaleDateString("en-CA");
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };
const dayDiff = iso => Math.round((new Date(iso + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g,"")); return isFinite(n) ? n : 0; };
function inr(n){
  n = num(n); if (!n) return "—";
  if (n >= 1e7) return "₹" + (n/1e7).toFixed(n >= 1e8 ? 1 : 2).replace(/\.?0+$/,"") + " Cr";
  if (n >= 1e5) return "₹" + (n/1e5).toFixed(2).replace(/\.?0+$/,"") + " L";
  return "₹" + n.toLocaleString("en-IN");
}
const inrFull = n => num(n) ? "₹" + Math.round(num(n)).toLocaleString("en-IN") : "";
function fmtDate(iso){ if(!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T00:00:00" : iso); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
function fmtDT(iso){ if(!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) + ", " + d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); }
function ago(iso){ if(!iso) return ""; const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 6e4)); if (m < 60) return m + " min"; const h = Math.round(m/60); if (h < 48) return h + " h"; return Math.round(h/24) + " days"; }
function dayLabel(iso){ const d = dayDiff(iso); if (d < 0) return (-d) + "d overdue"; if (d === 0) return "Today"; if (d === 1) return "Tomorrow"; return fmtDate(iso); }
function dayCls(iso){ const d = dayDiff(iso); return d < 0 ? "over" : d === 0 ? "today" : ""; }
const digits = p => String(p || "").replace(/\D/g, "");
function waLink(phone, text){ let d = digits(phone); if (d.length === 10) d = "91" + d; if (d.length === 11 && d[0] === "0") d = "91" + d.slice(1); return "https://wa.me/" + d + "?text=" + encodeURIComponent(text); }
const propById = id => S.props.find(p => p.id === id);
const ventureById = id => S.ventures.find(v => v.id === id);
function propTitle(p){ if(!p) return ""; if (p.kind === "Commercial") return p.title || (p.subtype || "Commercial") + " · " + (p.location || ""); const v = ventureById(p.ventureId); return (v ? v.name + " · " : "") + (p.plotNo ? "Plot " + p.plotNo : p.surveyNo ? "Sy. no. " + p.surveyNo + (p.location ? " · " + p.location : "") : (p.location || "Plot") + " land"); }
function propLine(p){ return [p.area ? p.area + " " + (p.areaUnit || "sq.yd") : "", p.facing ? p.facing + " facing" : "", p.approval && p.approval !== "None" ? p.approval : ""].filter(Boolean).join(" · "); }
function dimSqft(r){
  const L = num(r.length), B = num(r.breadth);
  if (L && B) return { v:L*B, approx:false };
  const n = num(r.sideN), s = num(r.sideS), e = num(r.sideE), w = num(r.sideW);
  if ((n || s) && (e || w)) return { v:((n + s) / (n && s ? 2 : 1)) * ((e + w) / (e && w ? 2 : 1)), approx:!(n === s && e === w) };
  return null;
}
function sqft(p){ const a = num(p.area); if (a) return a * (UNIT_SQFT[p.areaUnit || "sq.yd"] || 9); const d = dimSqft(p); return d ? d.v : 0; }
function sqyd(p){ return sqft(p) / 9; }
const fmtA = v => v >= 100 ? Math.round(v).toLocaleString("en-IN") : (+v.toFixed(2)).toLocaleString("en-IN");
function areaAll(sf){ return sf ? [[sf/9,"sq.yd"],[sf,"sq.ft"],[sf/435.6,"cents"],[sf/1089,"guntas"],[sf/43560,"acres"],[sf/72,"ankanam"]].map(([v,u]) => fmtA(v) + " " + u) : []; }
function dimText(p){ if (num(p.length) && num(p.breadth)) return num(p.length) + " × " + num(p.breadth) + " ft"; const s = ["sideN","sideS","sideE","sideW"].map(k => num(p[k])); return s.some(Boolean) ? "N " + (s[0]||"–") + " · S " + (s[1]||"–") + " · E " + (s[2]||"–") + " · W " + (s[3]||"–") + " ft" : ""; }
const sellerById = id => S.sellers.find(s => s.id === id);
function parseLatLng(str){
  const s = String(str || "");
  const m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/) ||
    s.match(/[?&](?:q|query|ll|destination|center)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i) || s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  return m ? [+m[1], +m[2]] : null;
}
function mapURL(p){ const ll = parseLatLng(p.mapLink); if (ll) return "https://www.google.com/maps/search/?api=1&query=" + ll[0] + "," + ll[1]; const l = String(p.mapLink || "").trim(); return /^https:\/\//i.test(l) ? l : ""; }
function findURL(p){ const q = [p.address, p.location, ventureById(p.ventureId)?.location].filter(Boolean).join(", "); return q ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q) : ""; }
const mediaURL = m => "/_blob/" + m.id;
const firstImg = p => (p.media || []).find(m => m.type === "image");
function shareMsg(l, m){
  return "Namaste " + l.name + " ji, sharing a " + (m.kind === "Commercial" ? (m.subtype || "commercial property").toLowerCase() : "plot") + " for you: " + propTitle(m) + ". " + propLine(m) + (dimText(m) ? " (" + dimText(m) + ")" : "") + (m.price ? ". Price " + inr(m.price) : "") + (m.location ? ". Location: " + m.location : "") + (mapURL(m) ? ". Map: " + mapURL(m) : "") + ". Would you like to see it this week?";
}
function ratePerSqyd(p){ const y = sqyd(p); return y ? num(p.price) / y : 0; }
const interestCls = i => i === "Commercial" ? "commercial" : i === "Venture" ? "venture" : "plot";
function toast(msg){ const r = $("#toastRoot"); r.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>"; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2600); }
function armDelete(btn, fn){ if (btn.classList.contains("armed")) { fn(); return; } btn.classList.add("armed"); const old = btn.textContent; btn.textContent = "Tap again to delete"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = old; }, 4000); }

/* ---------- persistence ---------- */
const COLL = { leads:"leads", props:"properties", ventures:"ventures", sellers:"sellers", agents:"agents", templates:"templates", docs:"documents", settingsList:"settings", news:"news", market:"market" };
async function save(kind, obj){
  obj.updatedAt = new Date().toISOString();
  const list = S[kind]; const i = list.findIndex(x => x.id === obj.id);
  if (i >= 0) list[i] = obj; else list.push(obj);
  render();
  if (!S.db) { toast("Not saved: storage isn't available in this view"); return; }
  const { id, ...body } = obj;
  try { await S.db.collection(COLL[kind]).doc(id).set(JSON.parse(JSON.stringify(body))); }
  catch (e) { handleWriteErr(e); }
}
async function remove(kind, id){
  S[kind] = S[kind].filter(x => x.id !== id); render();
  if (!S.db) return;
  try { await S.db.collection(COLL[kind]).doc(id).delete(); } catch (e) { handleWriteErr(e); }
}
function handleWriteErr(e){
  if (e && e.code === "invalid_argument") { S.readOnly = true; toast("You can view this CRM but not change it"); }
  else if (e && e.code === "quota_exceeded") toast("Storage is full. Delete old records, then try again.");
  else toast("Couldn't save. Check your connection and try again.");
  render();
}
async function boot(){
  try { S.dl = await window.claude?.use?.("downloads"); } catch { S.dl = null; }
  window.claude?.use?.("assets").then(a => { S.assets = a; }, () => { S.assets = null; });
  window.claude?.use?.("sample").then(a => { S.ai = a; renderDrawer(); }, () => { S.ai = null; });
  window.claude?.use?.("mcp").then(a => { S.mcp = a; }, () => { S.mcp = null; });
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { S.dbState = "none"; Object.keys(S.loaded).forEach(k => S.loaded[k] = true); render(); return; }
  S.db = db;
  const timer = setTimeout(() => { if (S.dbState === "connecting") { S.dbState = "slow"; render(); } }, 10000);
  for (const kind of Object.keys(COLL)) {
    db.collection(COLL[kind]).onSnapshot(snap => {
      S[kind] = snap.docs.map(d => ({ id:d.id, ...structuredClone(d.data()) }));
      if (!snap.metadata.fromCache) S.loaded[kind] = true;
      if (Object.values(S.loaded).every(Boolean)) { S.dbState = "ok"; clearTimeout(timer); }
      render();
    }, err => { clearTimeout(timer); S.dbState = "error"; S.loaded[kind] = true; render(); });
  }
}

/* ---------- derived ---------- */
function followUps(){
  return S.leads.filter(l => ACTIVE.includes(l.stage) && l.nextFollowUp).sort((a,b) => a.nextFollowUp.localeCompare(b.nextFollowUp));
}
function commission(l){ return num(l.dealValue) * num(l.commissionPct) / 100; }
/* ---------- phase 2: scoring, matching ---------- */
const TIMELINES = ["Immediately","Within 1 month","1–3 months","3–6 months","Just exploring"];
const AGENT_ROLES = ["Owner / broker","Agent","Telecaller","Field executive"];
const DOC_TYPES = ["Sale deed","Link documents","Encumbrance certificate (EC)","Pattadar passbook / ROR-1B","Layout / LP approval","RERA certificate","Building permission","Agreement of sale","Token / advance receipt","Registered sale deed","Power of attorney (GPA)","ID proof","Commission invoice","Broker RERA registration","Other"];
const CHECKLIST = [["title","Title documents verified"],["ec","EC (encumbrance certificate) checked"],["approval","Layout / RERA approval verified"],["agreement","Agreement of sale signed"],["token","Token / advance receipt given"],["slot","Registration slot booked"],["registered","Sale deed registered"],["invoice","Commission invoice sent"]];
const ST = () => S.settingsList.find(x => x.id === "main") || {};
const agentById = id => S.agents.find(a => a.id === id);
const agentName = id => agentById(id)?.name || "";
const initials = n => String(n || "").split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join("");
const last10 = p => digits(p).slice(-10);

function sizeSqyd(str){
  const m = String(str || "").toLowerCase().match(/(\d+(?:\.\d+)?)\s*(?:(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(sq\.?\s*ya?r?ds?|sq\.?\s*yd|sqyd|yards?|gaj|sq\.?\s*f(?:ee)?t|sqft|feet|cents?|acres?|guntas?|ankanam)?/);
  if (!m) return null;
  const u = m[3] || "sq.yd", k = /f(ee)?t/.test(u) ? 1/9 : /cent/.test(u) ? 48.4 : /acre/.test(u) ? 4840 : /gunta/.test(u) ? 121 : /ankanam/.test(u) ? 8 : 1;
  return [+m[1] * k, (m[2] ? +m[2] : +m[1]) * k];
}
function matchInfo(l, p){
  let s = 0; const why = [];
  const b = num(l.budget), pr = num(p.price);
  if (b && pr) { if (pr <= b * 1.1 && pr >= b * 0.5) { s += 3; why.push("in budget"); } else if (pr <= b * 1.25) { s += 1; why.push("a little over budget"); } else s -= 3; }
  const words = String(l.location || "").toLowerCase().split(/[\s,\/]+/).filter(w => w.length > 2);
  const v = ventureById(p.ventureId);
  const loc = [p.location, p.district, p.address, v?.location, v?.name].join(" ").toLowerCase();
  if (words.some(w => loc.includes(w))) { s += 3; why.push("preferred area"); }
  if (l.interest === "Venture" && p.ventureId) { s += 1; why.push("venture plot"); }
  const sz = sizeSqyd(l.sizeWanted), y = sqyd(p);
  if (sz && y) { if (y >= sz[0] * 0.85 && y <= sz[1] * 1.2) { s += 2; why.push("right size"); } else s -= 1; }
  if (l.facingPref && l.facingPref !== "Any" && p.facing) { if (p.facing === l.facingPref) { s += 2; why.push(p.facing + " facing"); } else s -= 1; }
  if (p.status === "Available") s += 1;
  if ((p.media || []).length) { s += 0.5; }
  return { s, why };
}
function matchesFor(l, n){
  const kind = l.interest === "Commercial" ? "Commercial" : "Plot";
  return S.props.filter(p => p.kind === kind && p.status !== "Sold").map(p => ({ p, s:matchInfo(l, p).s }))
    .filter(x => x.s >= 2).sort((a,b) => b.s - a.s).slice(0, n || 5).map(x => x.p);
}
function leadScore(l){
  if (l.stage === "Registered") return { band:"Won", score:100, reasons:["Deal registered"] };
  if (l.stage === "Lost") return { band:"Lost", score:0, reasons:[] };
  let s = 0; const r = [];
  const tl = { "Immediately":30, "Within 1 month":24, "1–3 months":14, "3–6 months":5, "Just exploring":0 }[l.timeline];
  if (tl == null) s += 8; else { s += tl; r.push("Buying " + l.timeline.toLowerCase()); }
  const st = { "New":4, "Contacted":10, "Site Visit":22, "Negotiation":30, "Token Paid":38 }[l.stage] || 0;
  s += st; if (st >= 22) r.push("At " + l.stage + " stage");
  const acts = (l.activities || []).filter(a => !["Stage","Follow-up","Checklist","AI"].includes(a.type));
  const recent = acts.filter(a => Date.now() - new Date(a.t) < 7 * 864e5).length;
  s += Math.min(15, recent * 5); if (recent) r.push(recent + " interaction" + (recent > 1 ? "s" : "") + " this week");
  const lastT = acts.length ? acts[acts.length - 1].t : l.createdAt;
  const idle = lastT ? (Date.now() - new Date(lastT)) / 864e5 : 0;
  if (idle > 14) { s -= 12; r.push("No contact for " + Math.round(idle) + " days"); }
  if (num(l.budget)) { s += 5; if (matchesFor(l, 1).length) { s += 8; r.push("Matching property in stock"); } } else r.push("Budget not known");
  if (l.nextFollowUp && dayDiff(l.nextFollowUp) < -3) { s -= 8; r.push("Follow-up overdue"); }
  s = Math.max(0, Math.min(100, Math.round(s)));
  return { band:s >= 55 ? "Hot" : s >= 30 ? "Warm" : "Cold", score:s, reasons:r };
}
function scoreOf(l){
  const r = leadScore(l);
  if (l.ai && l.ai.band && ACTIVE.includes(l.stage) && Date.now() - new Date(l.ai.at) < 14 * 864e5) return { ...r, band:l.ai.band, score:num(l.ai.score) || r.score, ai:true, aiReason:l.ai.reason, nextAction:l.ai.nextAction };
  return r;
}
function scoreChip(l){
  const r = scoreOf(l); if (r.band === "Won" || r.band === "Lost") return "";
  return '<span class="chip heat ' + r.band + '" title="' + esc((r.ai ? "AI score: " + (r.aiReason || "") : r.reasons.join(", "))) + '">' + (r.ai ? "✦ " : "") + r.band + " " + r.score + '</span>';

function parseMoney(v){
  const s = String(v ?? "").toLowerCase().replace(/,/g, "");
  const m = s.match(/(\d+(?:\.\d+)?)\s*(cr|crore|crores|l|lac|lacs|lakh|lakhs|k)?\b/); if (!m) return 0;
  const n = +m[1], u = m[2] || "";
  if (/^c/.test(u)) return Math.round(n * 1e7); if (/^l/.test(u)) return Math.round(n * 1e5); if (u === "k") return Math.round(n * 1e3);
  return n < 1000 ? Math.round(n * 1e5) : Math.round(n);
}
function parseEnquiry(t){
  const out = { notes:t.trim().slice(0, 1500) };
  const ph = t.replace(/[\s\-()]/g, "").match(/(?:\+?91|0)?([6-9]\d{9})(?!\d)/); if (ph) out.phone = ph[1];
  const srcMap = [["99acres",/99\s?acres/i],["MagicBricks",/magic\s?bricks/i],["Housing.com",/housing\.com|\bhousing\b/i],["NoBroker",/no\s?broker/i],["Facebook / Instagram",/facebook|instagram|\bfb\b|meta/i],["Google",/google/i],["WhatsApp",/whatsapp/i]];
  const sm = srcMap.find(([,re]) => re.test(t)); if (sm) out.source = sm[0];
  const bud = t.match(/(\d+(?:\.\d+)?)\s*(cr|crore|crores|l|lac|lacs|lakh|lakhs)\b/i); if (bud) out.budget = parseMoney(bud[0]);
  out.interest = /shop|office|commercial|showroom|warehouse|godown/i.test(t) ? "Commercial" : /venture|layout|gated|community/i.test(t) ? "Venture" : "Plot";
  const sz = t.match(/\d+(?:\.\d+)?\s*(?:(?:-|–|to)\s*\d+(?:\.\d+)?\s*)?(?:sq\.?\s*(?:yds?|yards|ft|feet)|sqyds?|sqft|gaj|yards|cents?|acres?|guntas?)/i); if (sz) out.sizeWanted = sz[0];
  const fac = [...FACING].sort((a,b) => b.length - a.length).find(f => new RegExp("\\b" + f.replace("-", "[- ]?") + "\\b", "i").test(t)); if (fac) out.facingPref = fac;
  const nm = t.match(/(?:name\s*[:\-]|i am|this is|my name is)\s*([A-Za-z][a-zA-Z.]+(?:\s[A-Za-z][a-zA-Z.]+)?)/i); if (nm) out.name = nm[1].replace(/\b\w/g, c => c.toUpperCase());
  const loc = t.match(/(?:location|area|locality|city)\s*[:\-]\s*([^\n,.;]+)/i) || t.match(/\b(?:in|at|near)\s+([A-Z][a-zA-Z]+(?:\s[A-Z][a-zA-Z]+)?)/); if (loc) out.location = loc[1].trim();
  if (/urgent|immediate|this week|asap/i.test(t)) out.timeline = "Immediately"; else if (/this month|within a month/i.test(t)) out.timeline = "Within 1 month";
  return out;
}

async function downloadDoc(d){

async function importFile(file){

    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:"" });
    if (rows.length < 2) return toast("That file has no rows to import.");

const MCP_ERR = { needs_reauth:"Google Sheets needs reconnecting. In claude.ai open Settings → Connectors and reconnect Google Sheets.", server_not_connected:"Google Sheets isn't connected. In claude.ai open Settings → Connectors and connect Google Sheets.", server_not_found:"Google Sheets isn't connected. In claude.ai open Settings → Connectors and connect Google Sheets.", approval_required:"Allow Bhoomi Desk to use Google Sheets when claude.ai asks.", not_granted:"Allow Bhoomi Desk to use Google Sheets when claude.ai asks.", blocked_by_policy:"Your organisation doesn't allow this connection.", rate_limited:"Google Sheets is busy. Try again in a minute.", server_unavailable:"Google Sheets didn't answer. Try again in a minute." };
function findValues(x, depth){
  depth = depth || 0; if (depth > 6 || x == null) return null;
  if (Array.isArray(x.values) && x.values.every(r => Array.isArray(r))) return x.values;
  if (typeof x === "string") { try { return findValues(JSON.parse(x), depth + 1); } catch { return null; } }
  if (Array.isArray(x)) { for (const v of x) { const r = findValues(v, depth + 1); if (r) return r; } return null; }
  if (typeof x === "object") { for (const v of Object.values(x)) { const r = findValues(v, depth + 1); if (r) return r; } }
  return null;
}
async function readSheet(){
  const msg = t => { const el = $("#sheetMsg"); if (el) el.textContent = t; };
  const url = ($("#st_sheetUrl")?.value || ST().sheetUrl || "").trim(), tab = ($("#st_sheetTab")?.value ?? ST().sheetTab ?? "").trim();
  const id = (url.match(/\/d\/([a-zA-Z0-9_-]{20,})/) || url.match(/^([a-zA-Z0-9_-]{20,})$/) || [])[1];
  if (!id) { msg("Paste the full link of the Google Sheet (it contains /spreadsheets/d/…)."); return null; }
  if (!S.mcp) { msg("Reading Google Sheets works when this page is open in claude.ai. You can download the sheet as .xlsx and use Choose file instead."); return null; }
  msg("Reading the sheet…");
  try {
    const r = await S.mcp.callTool("Google Sheets", "get_values", { spreadsheetId:id, range:(tab ? "'" + tab.replace(/'/g, "''") + "'!" : "") + "A1:Z5000" });
    const rows = findValues(r.payload) || findValues(r.structuredContent) || findValues((r.content || []).map(c => c.text).filter(Boolean));
    if (!rows) { msg("The sheet was read, but no rows came back. Check the tab name."); return null; }
    msg(rows.length - 1 + " rows read.");
    return { rows, url, tab };
  } catch (e) { msg(e && e.code === "tool_error" ? "Google Sheets couldn't open this sheet. Check the link and tab name, and that your Google account can open it." : MCP_ERR[e && e.code] || "Couldn't read the sheet right now. Try again."); return null; }
}

function mkConvert(m){
  const now = new Date().toISOString();
  let seller = m.phone ? S.sellers.find(s => last10(s.phone) === last10(m.phone)) : null;
  if (!seller) { seller = { id:uid(), name:m.contactName || ((m.postedBy === "Owner" ? "Owner" : "Contact") + " – " + (m.location || "listing")), phone:m.phone || "", village:m.location || "", sellerType:m.postedBy === "Broker" ? "Another broker" : m.postedBy === "Builder / developer" ? "Builder / Developer" : "Owner", notes:"From " + (m.source || "social media") + (m.url ? ": " + m.url : ""), createdAt:now }; save("sellers", seller); }
  const prop = { id:uid(), kind:m.kind === "Commercial" ? "Commercial" : "Plot", title:m.kind === "Commercial" ? "Commercial, " + (m.location || "") : "", sellerId:seller.id, location:m.location, district:m.district, area:m.area, areaUnit:m.areaUnit || "sq.yd", price:num(m.price), facing:m.facing, approval:m.approval || "None", approvalNo:m.approvalNo, status:"Available", notes:[m.notes, m.url ? "Original post: " + m.url : ""].filter(Boolean).join("\n"), media:(m.shots || []), createdAt:now };
  save("props", prop);
  save("market", { ...m, status:"Converted", sellerId:seller.id, propertyId:prop.id });
  toast("Seller and property created"); openDrawer("prop", prop.id);
}

function render(){
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.view === S.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });

  if (!Object.values(S.loaded).every(Boolean) && S.dbState !== "slow") html += '<div class="empty">Loading your records…</div>';
  else html += ({ today:viewToday, leads:viewLeads, inventory:viewInventory, sellers:viewSellers, deals:viewDeals, market:viewMarket, news:viewNews, team:viewTeam, documents:viewDocuments, settings:viewSettings }[S.view] || viewToday)();

function banners(){
  let h = "";
  if (S.dbState === "none") h += '<div class="banner"><p><b>Records aren\'t being saved here.</b> Open this page in claude.ai while signed in to keep your leads and inventory.</p></div>';

  if (S.dbState === "error") h += '<div class="banner"><p>Your records couldn\'t be loaded. Reload the page to try again.</p></div>';

/* ---------- view: leads ---------- */
function filteredLeads(){
  const q = S.leadQ.trim().toLowerCase();
  return S.leads.filter(l => (!S.leadInterest || l.interest === S.leadInterest) && (!S.leadAgent || (S.leadAgent === "_none" ? !l.assignedTo : l.assignedTo === S.leadAgent)) &&
    (!q || [l.name, l.phone, l.location, l.source, l.notes].join(" ").toLowerCase().includes(q)));
}

/* ---------- lead drawer ---------- */
function renderDrawer(){
  const root = $("#drawerRoot");
  const focusId = document.activeElement && document.activeElement.id;
  const scroll = $(".dbody", root)?.scrollTop || 0;
  const l = S.leads.find(x => x.id === S.openLead), pr = propById(S.openProp), se = sellerById(S.openSeller), mk = S.market.find(x => x.id === S.openMk);
  if (mk) root.innerHTML = mkDrawerHTML(mk);
  else if (l) root.innerHTML = leadDrawerHTML(l);
  else if (pr) root.innerHTML = propDrawerHTML(pr);
  else if (se) root.innerHTML = sellerDrawerHTML(se);
  else { if (root.innerHTML) root.innerHTML = ""; return; }
  const b = $(".dbody", root); if (b) b.scrollTop = scroll;
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}
function openDrawer(type, id){
  S.openLead = type === "lead" ? id : null; S.openProp = type === "prop" ? id : null; S.openSeller = type === "seller" ? id : null; S.openMk = type === "mk" ? id : null;

function patchLeadById(id, changes, log){
  const l = S.leads.find(x => x.id === id); if (!l || S.readOnly) return;
  const n = { ...l, ...changes };
  if (log) n.activities = [...(l.activities || []), { t:new Date().toISOString(), type:log[0], text:log[1] }].slice(-200);
  save("leads", n);
}

async function exifGPS(file){

  } catch {}

}
function tiffGPS(v, t){

    const e = gps + 2 + i * 12, tag = u16(e), type = u16(e + 2), cnt = u32(e + 4);
    if (tag === 1 || tag === 3) g[tag] = String.fromCharCode(v.getUint8(e + 8));

  }

  return [g[2] * (g[1] === "S" ? -1 : 1), g[4] * (g[3] === "W" ? -1 : 1)];
}

  const plots = S.props.filter(p => p.kind === "Plot").map(p => ({ "Venture":ventureById(p.ventureId)?.name || "Open plot", "Plot no.":p.plotNo, "Survey no.":p.surveyNo, ...seller(p), ...locn(p), ...meas(p), "Corner":p.corner ? "Yes" : "", "Price (₹ lakhs)":L(p.price), "Rate (₹/sq.yd)":Math.round(ratePerSqyd(p)) || "", "Approval":p.approval, "Approval no.":p.approvalNo, "Status":p.status, "Photos":(p.media || []).filter(m => m.type === "image").length, "Videos":(p.media || []).filter(m => m.type === "video").length, "Notes":p.notes }));
  const comm = S.props.filter(p => p.kind === "Commercial").map(p => ({ "Name":p.title, "Type":p.subtype, "For":p.dealType, ...seller(p), ...locn(p), ...meas(p), "Frontage (ft)":p.frontage, "Price (₹ lakhs)":L(p.price), "Rent (₹/month)":p.rent, "Approval":p.approval, "Approval no.":p.approvalNo, "Status":p.status, "Photos":(p.media || []).filter(m => m.type === "image").length, "Videos":(p.media || []).filter(m => m.type === "video").length, "Notes":p.notes }));
  const sellers = S.sellers.map(s => { const ps = S.props.filter(p => p.sellerId === s.id); return { "Name":s.name, "Mobile":s.phone, "Alternate mobile":s.altPhone, "Seller is":s.sellerType, "Address":s.address, "Village / city":s.village, "Documents seen":s.documents, "Properties":ps.length, "Available":ps.filter(p => p.status === "Available").length, "Property list":ps.map(propTitle).join("; "), "Notes":s.notes, "Added on":fmtDT(s.createdAt) }; });
  const vent = S.ventures.map(v => { const pl = S.props.filter(p => p.ventureId === v.id); return { "Venture":v.name, "Developer":v.developer, "Location":v.location, "Approval":v.approval, "Approval no.":v.approvalNo, "Total plots":v.totalPlots, "Plots listed":pl.length, "Available":pl.filter(p => p.status === "Available").length, "Sold":pl.filter(p => p.status === "Sold").length, "Rate (₹/sq.yd)":v.ratePerSqYd, "Commission %":v.commissionPct, "Amenities":v.amenities, "Notes":v.notes }; });
  const deals = S.leads.filter(l => l.stage === "Token Paid" || l.stage === "Registered").map(l => ({ "Client":l.name, "Mobile":l.phone, "Property":propTitle(propById(l.propertyId)), "Stage":l.stage, "Deal value (₹)":num(l.dealValue) || "", "Commission %":num(l.commissionPct) || "", "Commission (₹)":Math.round(commission(l)) || "", "Payment":l.commissionStatus || "Pending" }));
  const fu = followUps().map(l => ({ "Date":l.nextFollowUp, "Client":l.name, "Mobile":l.phone, "Stage":l.stage, "Next step":l.followUpNote, "Interest":l.interest, "Location":l.location }));
  const acts = []; S.leads.forEach(l => (l.activities || []).forEach(a => acts.push({ "When":fmtDT(a.t), "Client":l.name, "Type":a.type, "Details":a.text })));
  const wb = XLSX.utils.book_new();
  const add = (rows, name, cols) => { const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([cols]); ws["!cols"] = Object.keys(rows[0] || Object.fromEntries(cols.map(c => [c,1]))).map(k => ({ wch:Math.min(40, Math.max(k.length, ...rows.map(r => String(r[k] ?? "").length)) + 2) })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(leads, "Leads", ["Name"]); add(fu, "Follow-ups", ["Date"]); add(sellers, "Sellers", ["Name"]); add(plots, "Plots", ["Plot no."]); add(vent, "Ventures", ["Venture"]); add(comm, "Commercial", ["Name"]); add(deals, "Deals", ["Client"]);
  const prevP = S.teamPeriod; S.teamPeriod = "all";
  add(S.agents.map(a => { const x = agentStats(a.id); return { "Agent":a.name, "Role":a.role, "Mobile":a.phone, "Leads":x.leads, "Active":x.active, "Contacted %":x.contactedPct ?? "", "Avg first reply (h)":x.firstHrs == null ? "" : +x.firstHrs.toFixed(1), "Site visits":x.visits, "Deals":x.deals, "Deal value (₹)":x.value, "Commission (₹)":Math.round(x.comm) }; }), "Team", ["Agent"]);
  S.teamPeriod = prevP;
  const nrows = []; newsDays().slice(0, 60).forEach(d => (d.items || []).forEach(it => nrows.push({ "Date":d.id, "Title":it.title, "Category":it.category, "Status":it.status, "Impact":it.impact, "Location":it.location, "District":it.district, "Summary":it.summary, "Effect on land prices":it.impactNote, "Source":it.source, "Link":it.url, "Published":it.published })));
  add(nrows, "Area news", ["Date"]);
  add(S.market.map(m => ({ "Place":m.location, "District":m.district, "Type":m.kind, "Size":m.area, "Unit":m.areaUnit, "Price (₹ lakhs)":num(m.price) ? +(num(m.price)/1e5).toFixed(2) : "", "Rate (₹/sq.yd)":Math.round(mkRate(m)) || "", "Facing":m.facing, "Approval":[m.approval, m.approvalNo].filter(Boolean).join(" "), "Contact":m.contactName, "Mobile":m.phone, "Posted by":m.postedBy, "Found on":m.source, "Link":m.url, "Post date":m.postDate, "Status":m.status, "Notes":m.notes, "Saved on":fmtDT(m.createdAt) })), "Market listings", ["Place"]);
  add(S.docs.map(d => ({ "Title":d.title, "Type":d.docType, "Linked to":d.linkType === "general" ? "General" : d.linkType + ": " + docLinkName(d), "Valid until":d.expiry || "", "File":d.fileName, "Added on":fmtDT(d.createdAt), "Notes":d.notes })), "Documents", ["Title"]); add(acts, "Activity log", ["When"]);
  const buf = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  try { await S.dl.save({ filename:"Bhoomi-Desk-" + todayISO() + ".xlsx", data:new Blob([buf]) }); toast("Sheet downloaded"); }
  catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") toast("A download is already waiting for your OK"); else toast("Couldn't download the sheet in this view"); }
}

/* ---------- events ---------- */
function route(){ const h = location.hash.slice(1); S.view = ["today","leads","inventory","sellers","deals","market","news","team","documents","settings"].includes(h) ? h : "today"; render(); }
window.addEventListener("hashchange", route);
$("#exportBtn").addEventListener("click", exportSheet);
$("#addBtn").addEventListener("click", () => {
  if (S.view === "inventory") openForm(S.invTab === "Venture" ? "ventures" : S.invTab); else if (S.view === "sellers") openForm("sellerNew"); else if (S.view === "team") openForm("agents"); else if (S.view === "documents") openDocForm(); else if (S.view === "settings") openForm("templates"); else if (S.view === "market") openForm("market"); else openForm("leads");
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-lead],[data-prop],[data-venture],[data-mode],[data-inv],[data-openprop],[data-openseller],[data-openlead],[data-lb],[data-period],[data-agent],[data-viewdoc],[data-dldoc],[data-editdoc],[data-adddoc],[data-edittpl],[data-share],[data-logwa],[data-newsday],[data-newscat],[data-mk],[data-mkstatus],[data-mkshot]");
  if (!t || (t.closest("#dlg") && !t.dataset.act)) return;
  const act = t.dataset.act;
  if (act === "lbClose") { if (t.classList.contains("lightbox") && e.target !== t) return; S.lb = null; renderLB(); return; }
  if (act === "lbPrev" || act === "lbNext") { S.lb.i += act === "lbNext" ? 1 : -1; renderLB(); return; }
  if (t.dataset.lb) { S.lb = { items:propById(S.openProp)?.media || [], i:+t.dataset.lb }; renderLB(); return; }
  if (act === "closeLead") { closeDrawer(); return; }
  if (t.dataset.share) { const lid = t.dataset.sharelead, pid = t.dataset.share; setTimeout(() => { const l = S.leads.find(x => x.id === lid); if (l) patchLeadById(lid, { shared:[...new Set([...(l.shared || []), pid])] }, ["WhatsApp", "Shared " + propTitle(propById(pid))]); }, 400); return; }
  if (t.dataset.logwa) { const lid = S.openLead, txt = t.dataset.logwa; if (lid) setTimeout(() => patchLeadById(lid, {}, ["WhatsApp", txt]), 400); return; }
  if (act === "aiScore") { const l = S.leads.find(x => x.id === S.openLead); if (l) aiScore(l); return; }
  if (act === "aiDraft") { const l = S.leads.find(x => x.id === S.openLead); if (l) aiDraft(l); return; }
  if (act === "aiSummary") { const l = S.leads.find(x => x.id === S.openLead); if (l) aiSummary(l); return; }
  if (act === "aiStop") { aiCtl?.abort(); return; }
  if (act === "aiClose") { aiCtl?.abort(); S.aiOut = null; renderDrawer(); return; }
  if (act === "aiCopy") { const v = $("#dAiText")?.value || ""; navigator.clipboard?.writeText(v).then(() => toast("Message copied"), () => { $("#dAiText")?.select(); toast("Press copy on your keyboard or long-press to copy"); }); return; }
  if (act === "aiSaveSummary") {
    const l = S.leads.find(x => x.id === S.openLead); const o = S.aiOut; if (!l || !o?.data) return;
    const now = new Date().toISOString(); const acts = [...(l.activities || [])];
    if (o.pending) acts.push({ t:now, type:$("#dActType")?.value || "Call", text:o.pending });
    acts.push({ t:now, type:"AI summary", text:o.data.summary.join(" • ") });
    const ch = { activities:acts.slice(-200) }; if (o.data.nextStep) ch.followUpNote = o.data.nextStep; if (o.data.followUpDate) ch.nextFollowUp = o.data.followUpDate;
    if (l.stage === "New" && o.pending) ch.stage = "Contacted";
    S.aiOut = null; save("leads", { ...l, ...ch }); toast("Summary saved"); return;
  }
  if (act === "pasteEnq") { openPasteDialog(); return; }
  if (act === "saveSettings") { const v = k => $("#st_" + k)?.value.trim() || ""; save("settingsList", { ...ST(), id:"main", brokerName:v("brokerName"), brokerPhone:v("brokerPhone"), reraNo:v("reraNo"), reraState:v("reraState"), reraExpiry:v("reraExpiry"), newsRegion:v("newsRegion") || "Andhra Pradesh", newsFocus:v("newsFocus") }); toast("Settings saved"); return; }
  if (act === "sheetImport") { sheetImport(false); return; }
  if (act === "sheetSync") { sheetImport(true); return; }
  if (act === "addTpl") { openForm("templates"); return; }
  if (t.dataset.mk) { openDrawer("mk", t.dataset.mk); return; }
  if (t.dataset.mkstatus) { const m = S.market.find(x => x.id === S.openMk); if (m && !S.readOnly) save("market", { ...m, status:t.dataset.mkstatus }); return; }
  if (t.dataset.mkshot) { const m = S.market.find(x => x.id === S.openMk); if (m) { S.lb = { items:m.shots || [], i:+t.dataset.mkshot }; renderLB(); } return; }
  if (act === "mkShots") { mkOpenShots(); return; }
  if (act === "mkPaste") { mkOpenPaste(); return; }
  if (act === "mkManual") { openForm("market"); return; }
  if (act === "mkEdit") { openForm("market", S.market.find(x => x.id === S.openMk)); return; }
  if (act === "mkConvert") { const m = S.market.find(x => x.id === S.openMk); if (m) mkConvert(m); return; }
  if (act === "mkDelete") { armDelete(t, () => { const m = S.market.find(x => x.id === S.openMk); S.openMk = null; if (m) { (m.status === "Converted" ? [] : (m.shots || [])).forEach(s => S.assets?.delete(s.id).catch(() => {})); remove("market", m.id); } toast("Listing deleted"); }); return; }
  if (t.dataset.newsday) { S.newsDay = t.dataset.newsday; render(); return; }
  if (t.dataset.newscat) { S.newsCat = S.newsCat === t.dataset.newscat ? "" : t.dataset.newscat; render(); return; }
  if (t.dataset.period) { S.teamPeriod = t.dataset.period; render(); return; }
  if (t.dataset.agent) { openForm("agents", agentById(t.dataset.agent)); return; }
  if (t.dataset.edittpl) { openForm("templates", S.templates.find(x => x.id === t.dataset.edittpl)); return; }
  if (t.dataset.adddoc) { openDocForm({ linkType:t.dataset.adddoc, linkId:t.dataset.lid }); return; }
  if (t.dataset.editdoc) { openDocForm(null, S.docs.find(x => x.id === t.dataset.editdoc)); return; }
  if (t.dataset.dldoc) { const d = S.docs.find(x => x.id === t.dataset.dldoc); if (d) downloadDoc(d); return; }
  if (t.dataset.viewdoc) { const d = S.docs.find(x => x.id === t.dataset.viewdoc); if (d) { const k = docKind(d); if (k === "file") downloadDoc(d); else { S.lb = { items:[{ id:d.assetId, type:k, name:d.title || d.fileName }], i:0 }; renderLB(); } } return; }
  if (act === "editProp") { const p = propById(S.openProp); if (p) openForm(p.kind, p); return; }
  if (act === "editSeller") { openForm("sellers", sellerById(S.openSeller)); return; }
  if (act === "addPropFor") { openForm(t.dataset.kind, null, { sellerId:S.openSeller, location:sellerById(S.openSeller)?.village || "" }); return; }
  if (act === "delSeller") { armDelete(t, () => { const id = S.openSeller; S.openSeller = null; remove("sellers", id); toast("Seller deleted. Their properties stay in inventory."); }); return; }
  if (t.dataset.openprop) { openDrawer("prop", t.dataset.openprop); return; }
  if (t.dataset.openseller) { openDrawer("seller", t.dataset.openseller); return; }
  if (t.dataset.openlead) { openDrawer("lead", t.dataset.openlead); return; }
  if (act === "editLead") { openForm("leads", S.leads.find(x => x.id === S.openLead)); return; }
  if (act === "newLead") { openForm("leads"); return; }
  if (act === "copy") { const txt = t.dataset.text; navigator.clipboard?.writeText(txt).then(() => toast("Copied " + txt), () => toast("Select the number to copy it")); return; }
  if (act === "fuQuick") { const d = addDays(todayISO(), +t.dataset.days); patchLead({ nextFollowUp:d }, ["Follow-up", "Scheduled for " + fmtDate(d)]); return; }
  if (act === "addAct") { const tx = $("#dActText").value.trim(); if (!tx) { $("#dActText").focus(); return; } const ty = $("#dActType").value; const ch = {}; const l = S.leads.find(x => x.id === S.openLead); if (l && l.stage === "New" && ["Call","WhatsApp","Meeting","Site visit"].includes(ty)) ch.stage = "Contacted"; patchLead(ch, [ty, tx]); return; }
  if (act === "delLead") { armDelete(t, () => { const id = S.openLead; S.openLead = null; remove("leads", id); toast("Lead deleted"); }); return; }
  if (act === "clearSamples") { armDelete(t, async () => { const ks = [["leads"],["props"],["ventures"],["sellers"]]; for (const [k] of ks) for (const x of S[k].filter(y => y.sample)) await remove(k, x.id); toast("Sample records removed"); }); return; }
  if (t.dataset.mode) { S.leadMode = t.dataset.mode; render(); return; }
  if (t.dataset.inv) { S.invTab = t.dataset.inv; render(); return; }
  if (t.dataset.lead && !t.closest(".drawer")) { openDrawer("lead", t.dataset.lead); return; }
  if (t.dataset.prop) { openDrawer("prop", t.dataset.prop); return; }
  if (t.dataset.venture) { openForm("ventures", ventureById(t.dataset.venture)); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "leadQ") { S.leadQ = e.target.value; rerenderKeep(e.target); }
  if (e.target.id === "invQ") { S.invQ = e.target.value; rerenderKeep(e.target); }
  if (e.target.id === "sellerQ") { S.sellerQ = e.target.value; rerenderKeep(e.target); }
  if (e.target.id === "mkQ") { S.mkQ = e.target.value; rerenderKeep(e.target); }
  if (e.target.id === "newsQ") { S.newsQ = e.target.value; rerenderKeep(e.target); }
  if (e.target.id === "docQ") { S.docQ = e.target.value; rerenderKeep(e.target); }
  if (e.target.id === "dAiText") { const a = $("#aiWaLink"), l = S.leads.find(x => x.id === S.openLead); if (a && l) a.href = waLink(l.phone, e.target.value); if (S.aiOut) S.aiOut.text = e.target.value; }
  if (/^f_(length|breadth|side[NSEW]|area)$/.test(e.target.id)) updateDimCalc();
  if (e.target.id === "f_mapLink") updateMapHint();
});
function rerenderKeep(el){ const id = el.id, pos = el.selectionStart; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }
document.addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "f_sellerId") { const ns = $("#newSeller"); if (ns) { ns.hidden = v !== "__new"; if (v === "__new") $("#f_nsName").focus(); } return; }
  if (id === "f_areaUnit") { updateDimCalc(); return; }
  if (id === "leadInterest") { S.leadInterest = v; render(); }
  else if (id === "leadAgent") { S.leadAgent = v; render(); }
  else if (id === "docType") { S.docType = v; render(); }
  else if (id === "newsCat") { S.newsCat = v; render(); }
  else if (id === "mkKind") { S.mkKind = v; render(); }
  else if (id === "mkPosted") { S.mkPosted = v; render(); }
  else if (id === "mkStatus") { S.mkStatus = v; render(); }
  else if (id === "newsImpact") { S.newsImpact = v; render(); }
  else if (id === "docLink") { S.docLink = v; render(); }
  else if (id === "importFile") { const f = e.target.files[0]; e.target.value = ""; if (f) importFile(f); }
  else if (id === "dTpl" || id === "sTpl") { S.tplSel[id === "dTpl" ? "Buyer" : "Seller"] = v; renderDrawer(); }
  else if (id === "dAgent") patchLead({ assignedTo:v }, ["Note", v ? "Assigned to " + agentName(v) : "Unassigned"]);
  else if (id === "dTimeline") patchLead({ timeline:v }, v ? ["Note", "Timeline: " + v] : null);
  else if (/^ck_/.test(id)) { const k = id.slice(3), l = S.leads.find(x => x.id === S.openLead); if (l) patchLead({ checklist:{ ...(l.checklist || {}), [k]:e.target.checked } }, ["Checklist", (CHECKLIST.find(c => c[0] === k)?.[1] || k) + (e.target.checked ? " ✓" : " unchecked")]); }
  else if (id === "invStatus") { S.invStatus = v; render(); }
  else if (id === "dStage") { const l = S.leads.find(x => x.id === S.openLead); const ch = { stage:v }; if (v === "Registered") ch.closedAt = new Date().toISOString(); if ((v === "Token Paid" || v === "Registered") && !l.dealValue) { const p = propById(l.propertyId); if (p) ch.dealValue = num(p.price); if (!l.commissionPct) ch.commissionPct = num(ventureById(p?.ventureId)?.commissionPct) || 2; } patchLead(ch, ["Stage", l.stage + " → " + v]); }
  else if (id === "dFU") patchLead({ nextFollowUp:v }, v ? ["Follow-up", "Scheduled for " + fmtDate(v)] : null);
  else if (id === "dFUNote") patchLead({ followUpNote:v.trim() });
  else if (id === "dProp") { const p = propById(v); patchLead({ propertyId:v }, p ? ["Note", "Discussing " + propTitle(p)] : null); }
  else if (id === "dDeal") patchLead({ dealValue:Math.round(num(v) * 1e5) });
  else if (id === "dComm") patchLead({ commissionPct:num(v) });
  else if (id === "dCStat") patchLead({ commissionStatus:v }, ["Payment", "Commission " + v.toLowerCase()]);
});
document.addEventListener("keydown", e => {
  if (S.lb) { if (e.key === "Escape") { S.lb = null; renderLB(); return; } if (e.key === "ArrowRight" || e.key === "ArrowLeft") { S.lb.i += e.key === "ArrowRight" ? 1 : -1; renderLB(); return; } }
  if (e.key === "Escape" && (S.openLead || S.openProp || S.openSeller || S.openMk) && !$("#dlg").open) { closeDrawer(); } if (e.key === "Enter" && e.target.id === "dActText") { e.preventDefault(); $('[data-act="addAct"]').click(); } });
/* drag & drop on the board */
document.addEventListener("dragstart", e => { const c = e.target.closest?.(".card"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.lead); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", e => { const col = e.target.closest?.(".col"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(c => c !== col && c.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("dragleave", e => { const col = e.target.closest?.(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest?.(".col"); if (!col) return; e.preventDefault(); col.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain"), st = col.dataset.stage; const l = S.leads.find(x => x.id === id);
  if (!l || l.stage === st || S.readOnly) return;
  const prev = S.openLead; S.openLead = id;
  const ch = { stage:st }; if (st === "Registered") ch.closedAt = new Date().toISOString();
  patchLead(ch, ["Stage", (l.stage || "New") + " → " + st]); S.openLead = prev; render();
});

route();
boot();
})();
